<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div id="home">Home</div>
    </nav>
    <input type="text" id="FEN">
    <button id="cargarFEN">Cargar</button>
    <button id="cambiarModo">Cambiar modo</button>
    <p id="texto">Editor</p>
    <p id="textoTurno">Blanco</p>
    <div id="tablero">
    </div>
    <div id="contenedorPGN">PGN: </div>

    <!-- Modales -->
    <div id="modalCoronacion" class="modal-overlay oculto">
      <div class="modal-contenedor">
        <p>⚔️ Elige tu pieza 🛡️</p>
    
        <div class="opciones-grid">
          <div class="opcion-pieza" data-pieza="dama">
            <img id="img-dama" src="" alt="Dama" />
          </div>
          <div class="opcion-pieza" data-pieza="torre">
            <img id="img-torre" src="" alt="Torre" />
          </div>
          <div class="opcion-pieza" data-pieza="alfil">
            <img id="img-alfil" src="" alt="Alfil" />
          </div>
          <div class="opcion-pieza" data-pieza="caballo">
            <img id="img-caballo" src="" alt="Caballo" />
          </div>
        </div>
      </div>
    </div>

    <div id="modal-fin" class="modal-overlay oculto">
      <div class="modal-caja">
        <h2 id="modal-resultado">¡Jaque Mate!</h2>
        <p id="modal-ganador" class="modal-subtitulo">Ganan las blancas</p>
    
        <div class="modal-botones">
          <button id="btn-ver-tablero" class="btn-secundario">Ver tablero</button>
          <button id="btn-nueva-partida" class="btn-primario">Nueva partida</button>
        </div>
      </div>
    </div>

    <script src="src/main2.js" type="module"></script>
</body>
</html>
