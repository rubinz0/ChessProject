<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>
<body>

        <div id="home">Home</div>
    </nav>

    <div id="tablero">
    </div>
    <div id="contenedorPGN">PGN: </div>

    <div class="opciones-grid">
      <div class="opcion-pieza" data-pieza="dama">
        <img id="img-dama" src="" alt="Dama" />

      <div class="opcion-pieza" data-pieza="torre">
        <img id="img-torre" src="" alt="Torre" />
      </div>
      <div class="opcion-pieza" data-pieza="alfil">
        <img id="img-alfil" src="" alt="Alfil" />
      </div>
      <div class="opcion-pieza" data-pieza="caballo">
        <img id="img-caballo" src="" alt="Caballo" />

  </div>
</div>
    <script src="src/main2.js" type="module"></script>
